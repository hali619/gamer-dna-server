<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA LAB RESULT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;flex-direction:column;align-items:center;padding:20px 0 40px;min-height:100vh;font-family:'Roboto Condensed','Microsoft JhengHei',sans-serif}
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:40vh}
.spinner{width:36px;height:36px;border:2px solid rgba(255,255,255,0.15);border-top:2px solid #fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:monospace;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:4px}

/* 卡片 */
#card{
  width:375px;background:#fff;position:relative;overflow:hidden;display:none;
  background-image:linear-gradient(rgba(0,0,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.04) 1px,transparent 1px);
  background-size:18px 18px;
}
.cn{position:absolute;width:18px;height:18px;z-index:3}
.ctl{top:8px;left:8px;border-top:1.5px solid #111;border-left:1.5px solid #111}
.ctr{top:8px;right:8px;border-top:1.5px solid #111;border-right:1.5px solid #111}
.cbl{bottom:8px;left:8px;border-bottom:1.5px solid #111;border-left:1.5px solid #111}
.cbr{bottom:8px;right:8px;border-bottom:1.5px solid #111;border-right:1.5px solid #111}
.inn{position:relative;z-index:1;padding:18px 18px 20px}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#111;letter-spacing:3px}
.hr{font-family:'Share Tech Mono',monospace;font-size:8px;color:#999;letter-spacing:2px}
.hline{width:100%;height:1px;background:#111;position:relative;margin-bottom:10px}
.hline::before,.hline::after{content:'';position:absolute;width:5px;height:5px;background:#111;border-radius:50%;top:-2px}
.hline::before{left:0}.hline::after{right:0}

/* Archetype block */
.ab{border:1px solid rgba(0,0,0,0.2);padding:10px 12px;position:relative;background:#fff;margin-bottom:0}
.ab-label{position:absolute;top:-7px;left:10px;font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;letter-spacing:2px;background:#fff;padding:0 4px}
.ab-corner{position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid rgba(0,0,0,0.2);border-right:1px solid rgba(0,0,0,0.2)}
.at{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.an{font-family:'Share Tech Mono',monospace;font-size:7px;color:#999;letter-spacing:2px;margin-bottom:2px}
.aname{font-size:32px;font-weight:900;color:#111;line-height:0.9;letter-spacing:-1px}
.atags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;border:1px solid #111;padding:2px 6px;letter-spacing:1px}

/* 照片 */
.pw{width:100%;background:#0a0a0a;overflow:hidden}
.pw img{width:100%;display:block}
.pp{width:100%;aspect-ratio:4/3;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,0.15);letter-spacing:3px}

/* Capability block — 只用 HTML label，不用 ::before */
.db-wrap{position:relative;margin-top:0}
.db-label-row{padding:6px 0 0 10px}
.db-label{font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;letter-spacing:2px;background:#fff;display:inline-block;padding:0 4px;position:relative;top:7px;z-index:1}
.db{border:1px solid rgba(0,0,0,0.15);padding:10px 12px;position:relative;background:#fff}
.db-corner{position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid rgba(0,0,0,0.15);border-right:1px solid rgba(0,0,0,0.15)}
.dt{font-size:11px;color:#333;line-height:1.75;margin-top:4px}

/* 橫條圖 */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid rgba(0,0,0,0.1);border-top:none}
.si{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.08);border-right:1px solid rgba(0,0,0,0.08)}
.si:nth-child(2n){border-right:none}
.si:nth-last-child(-n+2){border-bottom:none}
.sn{font-family:'Share Tech Mono',monospace;font-size:7px;color:#999;letter-spacing:1px;margin-bottom:4px}
.sb{height:2px;background:rgba(0,0,0,0.08);margin-bottom:3px}
.sf{height:100%;background:#111;transition:width 1s ease}
.sv{font-family:'Share Tech Mono',monospace;font-size:8px;color:#111;text-align:right}

/* ROG footer */
.rf{padding:16px 0 14px;display:flex;justify-content:center;align-items:center}

/* 下載按鈕 */
#dl-btn{display:none;width:375px;margin-top:14px;height:46px;background:#fff;color:#111;border:none;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;cursor:pointer}
#dl-btn:active{opacity:0.7}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-txt">LOADING...</div>
</div>

<div id="card">
  <div class="cn ctl"></div><div class="cn ctr"></div>
  <div class="cn cbl"></div><div class="cn cbr"></div>
  <div class="inn" id="card-inner"></div>
</div>

<button id="dl-btn">↓ &nbsp; 儲存結果卡片</button>

const TYPE_NUM={tactical:'01',speedy:'02',burst:'03',sniper:'04',builder:'05',futurist:'06'};
const TYPE_EN={tactical:'TACTICAL COMMANDER',speedy:'SPEED HUNTER',burst:'BURST BREAKER',sniper:'PRECISION SNIPER',builder:'CREATIVE BUILDER',futurist:'FUTURE CONTROLLER'};
const TYPE_NAMES={tactical:'戰術指揮者',speedy:'極速獵手',burst:'爆發破局者',sniper:'精準狙擊手',builder:'創造建構者',futurist:'未來操控者'};

async function init(){
  const id=location.pathname.split('/').pop();
  if(!id)return showErr('無效的連結');
  try{
    const res=await fetch(`/api/result/${id}`);
    if(!res.ok){const e=await res.json();return showErr(e.error||'找不到此結果');}
    render(await res.json());
  }catch(e){showErr('載入失敗');}
}

function render(data){
  const{type,typeName,tags,desc,scores,photo,id}=data;
  const num=TYPE_NUM[type]||'01';
  const en=TYPE_EN[type]||'';
  const vals=Object.values(scores||{});
  const max=vals.length?Math.max(...vals):1;

  document.getElementById('card-inner').innerHTML=`
    <div class="hdr">
      <div class="hl">▶ DNA LAB RESULT OUTPUT</div>
      <div class="hr">SESSION #${id}</div>
    </div>
    <div class="hline"></div>

    <div class="ab">
      <span class="ab-label">ARCHETYPE DETECTED</span>
      <div class="ab-corner"></div>
      <div class="at">
        <div>
          <div class="an">ARCHETYPE ${num} —— ${en}</div>
          <div class="aname">${typeName}</div>
          <div class="atags">${(tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
        <div>${ROG_LOGO}</div>
      </div>
    </div>

    <div class="pw">
      ${photo?`<img src="${photo}" crossorigin="anonymous"/>`:`<div class="pp">USER SCAN</div>`}
    </div>

    <div class="db-wrap">
      <div class="db-label-row"><span class="db-label">CAPABILITY ANALYSIS</span></div>
      <div class="db">
        <div class="db-corner"></div>
        <div class="dt">${desc}</div>
      </div>
    </div>

    <div class="sg">
      ${Object.entries(scores||{}).map(([t,v])=>{
        const pct=max>0?Math.round((v/max)*100):0;
        return `<div class="si">
          <div class="sn">${TYPE_NAMES[t]||t}</div>
          <div class="sb"><div class="sf" style="width:0%" data-w="${pct}%"></div></div>
          <div class="sv">${pct}%</div>
        </div>`;
      }).join('')}
    </div>

    <div class="rf">${ROG_TEXT}</div>
  `;

  document.getElementById('loading').style.display='none';
  document.getElementById('card').style.display='block';
  document.getElementById('dl-btn').style.display='block';

  setTimeout(()=>{
    document.querySelectorAll('.sf').forEach(b=>b.style.width=b.dataset.w);
  },400);

  document.getElementById('dl-btn').addEventListener('click',async()=>{
    const btn=document.getElementById('dl-btn');
    btn.style.display='none';
    try{
      const canvas=await html2canvas(document.getElementById('card'),{
        useCORS:true,allowTaint:true,scale:2,backgroundColor:'#ffffff'
      });
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/jpeg',0.95);
      a.download='gamer-dna-result.jpg';
      a.click();
    }catch(e){console.error(e);}
    btn.style.display='block';
  });
}

function showErr(msg){
  document.getElementById('loading').innerHTML=`<div style="font-size:24px;margin-bottom:8px;color:#fff">⚠</div><div class="loading-txt">${msg}</div>`;
}
init();
</script>
</body>
</html>

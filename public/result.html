<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA LAB RESULT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Roboto Condensed','Microsoft JhengHei',sans-serif}

/* 載入中畫面 */
#loading{display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff}
.spinner{width:36px;height:36px;border:2px solid rgba(255,255,255,0.15);border-top:2px solid #fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:monospace;font-size:12px;color:rgba(255,255,255,0.5);letter-spacing:4px}

/* 結果圖片 */
#result-img{display:none;max-width:100%;width:390px;box-shadow:0 0 40px rgba(0,0,0,0.6)}
.hint{font-family:monospace;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:2px;margin-top:14px;display:none}

/* 隱藏的卡片（用來截圖）*/
#card-wrap{
  position:fixed;top:0;left:0;
  width:390px;
  background:#fff;
  visibility:hidden;
  pointer-events:none;
  z-index:-1;
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-txt">GENERATING...</div>
</div>

<img id="result-img" alt="DNA Result Card"/>
<div class="hint" id="hint">長按圖片儲存至相簿</div>

<!-- 用來截圖的隱藏卡片 -->
<div id="card-wrap"></div>

<script>
const ROG_SVG=`<svg width="130" height="78" viewBox="0 0 240 144" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 64.6633C0 64.6633 8.16511 90.0315 15.5878 98.4874C23.0105 106.943 49.4848 114.902 49.4848 114.902L0.247666 64.6633H0ZM214.762 0C195.958 0 168.247 4.22864 147.464 14.6742C130.391 23.1302 79.9171 81.5756 76.4531 85.3062C71.5047 90.7776 70.0189 92.0213 62.8436 89.2855C51.2147 85.0575 33.4016 73.617 33.4016 73.617C33.4016 73.617 52.9468 108.684 59.8747 119.13C70.5139 135.544 88.5767 144 88.5767 144C88.5767 144 75.2145 127.337 71.7505 120.125C68.534 113.41 72.494 107.689 91.5456 91.0259C122.721 63.4197 150.432 41.0367 177.896 24.6222C203.876 9.20257 218.473 4.97433 229.607 0.248947C226.885 0.248947 220.948 0.248947 214.762 0.248947V0ZM179.875 44.5183C136.575 69.14 79.4221 115.15 79.4221 115.15C95.7521 127.088 137.32 144 166.516 144C198.928 144 229.607 51.7309 229.607 51.7309C173.689 77.8449 136.575 100.228 136.575 100.228L195.215 79.8346C195.215 79.8346 176.658 127.585 155.38 127.585C130.638 127.585 101.939 114.404 101.939 114.404C151.671 75.855 228.37 40.788 232.576 38.5496C236.782 36.56 240 28.3528 240 24.6222C237.773 24.6222 208.579 28.3525 179.63 44.5183H179.875Z" fill="#686868"/></svg>`;

const ROG_TEXT_SVG=`<svg width="200" height="24" viewBox="0 0 571 29" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M34.9375 28.0625C30.0208 28.0625 26.7292 28.0625 25.0625 28.0625C17.6042 19.5208 12.625 13.8333 10.125 11C16.9583 11 21.5208 11.0208 23.8125 11.0625C23.8125 8.60417 23.8125 6.77083 23.8125 5.5625C23.8125 5.39583 23.7708 5.14583 23.6875 4.8125C23.6458 4.47917 23.4375 4.3125 23.0625 4.3125C15.7708 4.3125 10.8958 4.3125 8.4375 4.3125C8.4375 16.1875 8.4375 24.1042 8.4375 28.0625C4.22917 28.0625 1.41667 28.0625 0 28.0625C0 15.8958 0 7.77083 0 3.6875C0 1.97917 0 0.833333 0 0.25C13.3333 0.25 23.3333 0.25 30 0.25C30.625 0.25 31.1042 0.520833 31.4375 1.0625C31.8125 1.60417 32 2.1875 32 2.8125C32 9.47917 32 13.9375 32 16.1875C28.25 16.1875 25.75 16.1875 24.5 16.1875C29.7083 22.1042 33.1875 26.0625 34.9375 28.0625ZM71.5625 28.0625C66.3125 28.0625 55.8542 28.0625 40.1875 28.0625C40.1875 26.3125 40.1875 22.8125 40.1875 17.5625C40.1875 14.6458 40.1875 8.79167 40.1875 0C45.3958 0 55.8542 0 71.5625 0C70.8542 0.708333 69.4375 2.10417 67.3125 4.1875C64.1875 4.1875 57.9167 4.1875 48.5 4.1875C48.5 5.47917 48.5 8.02083 48.5 11.8125C52.0417 11.8125 59.125 11.8125 69.75 11.8125C69.75 12.5625 69.75 14.0417 69.75 16.25C66.2083 16.25 59.125 16.25 48.5 16.25C48.5 17.5 48.5 20.0417 48.5 23.875C51.625 23.875 57.8958 23.875 67.3125 23.875C68.0208 24.5833 69.4375 25.9792 71.5625 28.0625ZM140.125 28.0625C134.917 28.0625 124.5 28.0625 108.875 28.0625C108.875 25.1458 108.875 19.3333 108.875 10.625C108.875 8.91667 108.875 5.45833 108.875 0.25C110.25 0.25 112.979 0.25 117.062 0.25C117.062 4.20833 117.062 12.1042 117.062 23.9375C119.562 23.9375 124.521 23.9375 131.938 23.9375C131.938 19.9792 131.938 12.0833 131.938 0.25C133.312 0.25 136.042 0.25 140.125 0.25C140.125 4.875 140.125 14.1458 140.125 28.0625ZM218.062 28.0625C216.688 28.0625 213.917 28.0625 209.75 28.0625C209.75 26.3125 209.75 22.8333 209.75 17.625C209.75 14.7083 209.75 8.91667 209.75 0.25C211.125 0.25 213.896 0.25 218.062 0.25C218.062 4.875 218.062 14.1458 218.062 28.0625ZM569.625 28.0625C565.083 28.0625 556.042 28.0625 542.5 28.0625C541.625 27.3542 539.896 25.9167 537.312 23.75C541.271 23.75 549.25 23.75 561.25 23.75C561.25 22.5 561.25 19.9583 561.25 16.125C557.417 16.125 549.771 16.125 538.312 16.125C538.312 13.4583 538.312 8.16667 538.312 0.25C543.604 0.25 554.208 0.25 570.125 0.25C569.5 0.916667 568.271 2.29167 566.438 4.375C563.104 4.375 556.5 4.375 546.625 4.375C546.625 5.625 546.625 8.14583 546.625 11.9375C550.458 11.9375 558.125 11.9375 569.625 11.9375C569.625 14.6042 569.625 19.9792 569.625 28.0625Z" fill="#686868"/></svg>`;

const TYPE_NUM={tactical:'01',speedy:'02',burst:'03',sniper:'04',builder:'05',futurist:'06'};
const TYPE_EN={tactical:'TACTICAL COMMANDER',speedy:'SPEED HUNTER',burst:'BURST BREAKER',sniper:'PRECISION SNIPER',builder:'CREATIVE BUILDER',futurist:'FUTURE CONTROLLER'};
const TYPE_NAMES={tactical:'戰術指揮者',speedy:'極速獵手',burst:'爆發破局者',sniper:'精準狙擊手',builder:'創造建構者',futurist:'未來操控者'};

function buildCard(data){
  const{type,typeName,tags,desc,scores,photo,id}=data;
  const num=TYPE_NUM[type]||'01';
  const en=TYPE_EN[type]||'';
  const max=Math.max(...Object.values(scores||{}));

  return `
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=Share+Tech+Mono&display=swap');
    #card{width:390px;background:#fff;font-family:'Roboto Condensed','Microsoft JhengHei',sans-serif;position:relative;overflow:hidden}
    #card::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.04) 1px,transparent 1px);background-size:18px 18px;pointer-events:none;z-index:0}
    .cn{position:absolute;width:18px;height:18px;z-index:3}
    .ctl{top:8px;left:8px;border-top:1.5px solid #111;border-left:1.5px solid #111}
    .ctr{top:8px;right:8px;border-top:1.5px solid #111;border-right:1.5px solid #111}
    .cbl{bottom:8px;left:8px;border-bottom:1.5px solid #111;border-left:1.5px solid #111}
    .cbr{bottom:8px;right:8px;border-bottom:1.5px solid #111;border-right:1.5px solid #111}
    .inn{position:relative;z-index:1;padding:18px 18px 20px}
    .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .hl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#111;letter-spacing:3px}
    .hr{font-family:'Share Tech Mono',monospace;font-size:8px;color:#999;letter-spacing:2px}
    .hline{width:100%;height:1px;background:#111;position:relative;margin-bottom:10px}
    .hline::before,.hline::after{content:'';position:absolute;width:5px;height:5px;background:#111;border-radius:50%;top:-2px}
    .hline::before{left:0}.hline::after{right:0}
    .ab{border:1px solid rgba(0,0,0,0.2);padding:10px 12px;position:relative;background:rgba(255,255,255,0.8)}
    .ab::before{content:'ARCHETYPE DETECTED';position:absolute;top:-7px;left:10px;font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;letter-spacing:2px;background:#fff;padding:0 4px}
    .ab::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid rgba(0,0,0,0.2);border-right:1px solid rgba(0,0,0,0.2)}
    .at{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .an{font-family:'Share Tech Mono',monospace;font-size:7px;color:#999;letter-spacing:2px;margin-bottom:2px}
    .aname{font-size:32px;font-weight:900;color:#111;line-height:0.9;letter-spacing:-1px}
    .atags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .tag{font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;border:1px solid #111;padding:2px 6px;letter-spacing:1px}
    .pw{width:100%;position:relative;background:#0a0a0a;overflow:hidden}
    .pw img{width:100%;display:block}
    .pp{width:100%;aspect-ratio:4/3;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,0.15);letter-spacing:3px}
    .clw{padding:5px 0 0 12px}
    .cll{font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;letter-spacing:2px;background:#fff;display:inline-block;padding:1px 4px}
    .db{border:1px solid rgba(0,0,0,0.15);border-top:none;padding:10px 12px;position:relative;background:rgba(255,255,255,0.8)}
    .db::before{content:'CAPABILITY ANALYSIS';position:absolute;top:-7px;left:10px;font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;letter-spacing:2px;background:#fff;padding:0 4px}
    .db::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid rgba(0,0,0,0.15);border-right:1px solid rgba(0,0,0,0.15)}
    .dt{font-size:11px;color:#333;line-height:1.75;margin-top:4px}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid rgba(0,0,0,0.1);border-top:none}
    .si{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.08);border-right:1px solid rgba(0,0,0,0.08)}
    .si:nth-child(2n){border-right:none}
    .si:nth-last-child(-n+2){border-bottom:none}
    .sn{font-family:'Share Tech Mono',monospace;font-size:7px;color:#999;letter-spacing:1px;margin-bottom:4px}
    .sb{height:2px;background:rgba(0,0,0,0.08);margin-bottom:3px}
    .sf{height:100%;background:#111}
    .sv{font-family:'Share Tech Mono',monospace;font-size:8px;color:#111;text-align:right}
    .rf{padding:16px 0 14px;display:flex;justify-content:center}
  </style>
  <div id="card">
    <div class="cn ctl"></div><div class="cn ctr"></div>
    <div class="cn cbl"></div><div class="cn cbr"></div>
    <div class="inn">
      <div class="hdr"><div class="hl">▶ DNA LAB RESULT OUTPUT</div><div class="hr">SESSION #${id}</div></div>
      <div class="hline"></div>
      <div class="ab">
        <div class="at">
          <div>
            <div class="an">ARCHETYPE ${num} —— ${en}</div>
            <div class="aname">${typeName}</div>
            <div class="atags">${(tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div>${ROG_SVG}</div>
        </div>
      </div>
      <div class="pw">
        ${photo?`<img src="${photo}" crossorigin="anonymous"/>`:`<div class="pp">USER SCAN</div>`}
      </div>
      <div class="clw"><span class="cll">CAPABILITY ANALYSIS</span></div>
      <div class="db">
        <div class="dt">${desc}</div>
      </div>
      <div class="sg">
        ${Object.entries(scores||{}).map(([t,v])=>{
          const pct=max>0?Math.round((v/max)*100):0;
          return `<div class="si"><div class="sn">${TYPE_NAMES[t]||t}</div><div class="sb"><div class="sf" style="width:${pct}%"></div></div><div class="sv">${pct}%</div></div>`;
        }).join('')}
      </div>
      <div class="rf">${ROG_TEXT_SVG}</div>
    </div>
  </div>`;
}

async function init(){
  const id=location.pathname.split('/').pop();
  if(!id) return showErr('無效的連結');
  try{
    const res=await fetch(`/api/result/${id}`);
    if(!res.ok){const e=await res.json();return showErr(e.error||'找不到此結果');}
    const data=await res.json();

    // 建立隱藏卡片
    const wrap=document.getElementById('card-wrap');
    wrap.innerHTML=buildCard(data);

    // 等字體與圖片載入
    await document.fonts.ready;
    if(data.photo){
      await new Promise(r=>{
        const img=wrap.querySelector('img');
        if(!img||img.complete)return r();
        img.onload=r;img.onerror=r;
      });
    }
    // 延遲一點確保渲染完成
    await new Promise(r=>setTimeout(r,300));

    // 截圖
    const canvas=await html2canvas(wrap.querySelector('#card'),{
      useCORS:true,allowTaint:true,scale:2,backgroundColor:'#ffffff'
    });

    // 顯示結果圖片
    const imgEl=document.getElementById('result-img');
    imgEl.src=canvas.toDataURL('image/jpeg',0.95);
    imgEl.style.display='block';

    document.getElementById('hint').style.display='block';
    document.getElementById('loading').style.display='none';

  }catch(e){
    console.error(e);
    showErr('載入失敗');
  }
}

function showErr(msg){
  document.getElementById('loading').innerHTML=`<div style="font-size:20px;margin-bottom:8px">⚠</div><div class="loading-txt">${msg}</div>`;
}

init();
</script>
</body>
</html>
